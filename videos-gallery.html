<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Webinars - Multi-Platform Aggregator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white min-h-screen">
    
    <!-- Header -->
    <div class="bg-slate-800/50 backdrop-blur-sm border-b border-slate-700 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold mb-2">Our Webinars</h1>
            <p class="text-slate-400">Watch all our webinars from YouTube, Spotify, and Apple Podcasts</p>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Debug Info -->
        <div id="debugInfo" class="bg-blue-900/20 border border-blue-500 rounded-lg p-4 mb-6 hidden">
            <p class="text-blue-400" id="debugText"></p>
        </div>

        <!-- Filter Buttons -->
        <div class="flex flex-wrap gap-3 mb-8">
            <button onclick="setFilter('all')" id="filter-all" 
                class="px-6 py-2 rounded-full font-medium transition bg-blue-600 text-white">
                All Platforms (<span id="count-all">0</span>)
            </button>
            <button onclick="setFilter('youtube')" id="filter-youtube"
                class="px-6 py-2 rounded-full font-medium transition bg-slate-700 text-slate-300 hover:bg-slate-600">
                YouTube (<span id="count-youtube">0</span>)
            </button>
            <button onclick="setFilter('spotify')" id="filter-spotify"
                class="px-6 py-2 rounded-full font-medium transition bg-slate-700 text-slate-300 hover:bg-slate-600">
                Spotify (<span id="count-spotify">0</span>)
            </button>
            <button onclick="setFilter('apple')" id="filter-apple"
                class="px-6 py-2 rounded-full font-medium transition bg-slate-700 text-slate-300 hover:bg-slate-600">
                Apple Podcasts (<span id="count-apple">0</span>)
            </button>
            <button onclick="fetchAllVideos()" 
                class="ml-auto px-6 py-2 rounded-full font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition">
                Refresh
            </button>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="mt-4 text-slate-400">Loading webinars...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="bg-red-900/20 border border-red-500 rounded-lg p-4 mb-6 hidden">
            <div class="flex items-start gap-3">
                <svg class="w-5 h-5 text-red-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <div>
                    <p class="text-red-400 font-medium mb-2">Error Loading Videos</p>
                    <p class="text-red-300 text-sm" id="errorText"></p>
                    <p class="text-red-300 text-sm mt-2">
                        Open browser console (F12) to see detailed error information.
                    </p>
                </div>
            </div>
        </div>

        <!-- Videos Grid -->
        <div id="videosGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Videos will be inserted here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12 hidden">
            <svg class="w-16 h-16 text-slate-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-slate-400 text-lg mb-2">No webinars found</p>
            <p class="text-slate-500 text-sm">
                Please check your API configuration and ensure the playlist contains videos.
            </p>
        </div>
    </div>

    <script>
        // Configuration
        const config = {
            youtube: {
                apiKey: 'AIzaSyD0tm2RIa_-sw-GQH4DQjrCSaSnDfpy3Y4',
                playlistId: 'PL7bncXIEyEmGNmN120h3N_lNV_gGFlfoN',
                channelId: 'sarithaayyasamy974'
            },
            spotify: {
                clientId: 'YOUR_SPOTIFY_CLIENT_ID',
                clientSecret: 'YOUR_SPOTIFY_CLIENT_SECRET',
                showId: 'YOUR_SHOW_ID'
            },
            apple: {
                feedUrl: 'YOUR_APPLE_PODCAST_RSS_FEED_URL'
            }
        };

        let allVideos = [];
        let currentFilter = 'all';

        // Show debug info
        function showDebug(message) {
            const debugDiv = document.getElementById('debugInfo');
            const debugText = document.getElementById('debugText');
            debugText.textContent = message;
            debugDiv.classList.remove('hidden');
        }

        // Hide debug info
        function hideDebug() {
            document.getElementById('debugInfo').classList.add('hidden');
        }

        // Show error
        function showError(message) {
            const errorDiv = document.getElementById('error');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        // Hide error
        function hideError() {
            document.getElementById('error').classList.add('hidden');
        }

        // Show/hide loading
        function setLoading(isLoading) {
            document.getElementById('loading').classList.toggle('hidden', !isLoading);
        }

        // Fetch YouTube videos
        async function fetchYouTubeVideos() {
            const { apiKey, playlistId } = config.youtube;
            const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${playlistId}&key=${apiKey}`;
            
            console.log('Fetching from:', url);
            
            const response = await fetch(url);
            const data = await response.json();
            
            console.log('YouTube API Response:', data);
            
            if (!response.ok) {
                throw new Error(data.error?.message || 'YouTube API request failed');
            }
            
            if (!data.items || data.items.length === 0) {
                console.warn('No items found in YouTube response');
                return [];
            }
            
            return data.items.map(item => {
                const snippet = item.snippet;
                const videoId = item.contentDetails?.videoId || item.snippet?.resourceId?.videoId;
                
                return {
                    id: videoId,
                    title: snippet.title,
                    description: snippet.description,
                    thumbnail: snippet.thumbnails?.medium?.url || snippet.thumbnails?.default?.url,
                    date: snippet.publishedAt,
                    duration: 'Video',
                    platform: 'youtube',
                    url: `https://www.youtube.com/watch?v=${videoId}`
                };
            });
        }

        // Fetch Spotify podcasts
        async function fetchSpotifyPodcasts() {
            const { clientId, clientSecret, showId } = config.spotify;
            
            if (clientId === 'YOUR_SPOTIFY_CLIENT_ID') {
                return [];
            }
            
            const tokenResponse = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'Authorization': 'Basic ' + btoa(clientId + ':' + clientSecret)
                },
                body: 'grant_type=client_credentials'
            });
            
            if (!tokenResponse.ok) {
                throw new Error('Spotify authentication failed');
            }
            
            const tokenData = await tokenResponse.json();
            const accessToken = tokenData.access_token;
            
            const episodesResponse = await fetch(
                `https://api.spotify.com/v1/shows/${showId}/episodes?limit=50`,
                {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                }
            );
            
            if (!episodesResponse.ok) {
                throw new Error('Failed to fetch Spotify episodes');
            }
            
            const episodesData = await episodesResponse.json();
            
            return episodesData.items?.map(item => ({
                id: item.id,
                title: item.name,
                description: item.description,
                thumbnail: item.images[0]?.url || '',
                date: item.release_date,
                duration: Math.floor(item.duration_ms / 60000) + ' min',
                platform: 'spotify',
                url: item.external_urls.spotify
            })) || [];
        }

        // Fetch Apple podcasts
        async function fetchApplePodcasts() {
            const { feedUrl } = config.apple;
            
            if (feedUrl === 'YOUR_APPLE_PODCAST_RSS_FEED_URL') {
                return [];
            }
            
            const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`);
            
            if (!response.ok) {
                throw new Error('Failed to fetch Apple Podcasts RSS');
            }
            
            const data = await response.json();
            
            if (data.status !== 'ok') {
                throw new Error(data.message || 'RSS parsing failed');
            }
            
            return data.items?.map(item => ({
                id: item.guid,
                title: item.title,
                description: item.description,
                thumbnail: item.thumbnail || data.feed?.image || '',
                date: item.pubDate,
                duration: 'Podcast',
                platform: 'apple',
                url: item.link
            })) || [];
        }

        // Fetch all videos
        async function fetchAllVideos() {
            setLoading(true);
            hideError();
            hideDebug();
            showDebug('Starting fetch...');
            
            try {
                allVideos = [];
                
                // Fetch YouTube videos
                try {
                    showDebug('Fetching YouTube videos...');
                    const youtubeVideos = await fetchYouTubeVideos();
                    allVideos.push(...youtubeVideos);
                    showDebug(`Found ${youtubeVideos.length} YouTube videos`);
                } catch (err) {
                    console.error('YouTube error:', err);
                    showDebug(`YouTube error: ${err.message}`);
                }

                // Fetch Spotify podcasts
                if (config.spotify.clientId !== 'YOUR_SPOTIFY_CLIENT_ID') {
                    try {
                        showDebug('Fetching Spotify podcasts...');
                        const spotifyData = await fetchSpotifyPodcasts();
                        allVideos.push(...spotifyData);
                    } catch (err) {
                        console.error('Spotify error:', err);
                    }
                }

                // Fetch Apple podcasts
                if (config.apple.feedUrl !== 'YOUR_APPLE_PODCAST_RSS_FEED_URL') {
                    try {
                        showDebug('Fetching Apple podcasts...');
                        const appleData = await fetchApplePodcasts();
                        allVideos.push(...appleData);
                    } catch (err) {
                        console.error('Apple error:', err);
                    }
                }

                if (allVideos.length === 0) {
                    showError('No videos found. This could be due to: API key restrictions, incorrect playlist ID, or CORS issues. Check console for details.');
                }

                // Sort by date, newest first
                allVideos.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                hideDebug();
                updateCounts();
                renderVideos();
            } catch (err) {
                showError(`Failed to fetch videos: ${err.message}`);
                console.error('Fetch error:', err);
            } finally {
                setLoading(false);
            }
        }

        // Update counts
        function updateCounts() {
            document.getElementById('count-all').textContent = allVideos.length;
            document.getElementById('count-youtube').textContent = allVideos.filter(v => v.platform === 'youtube').length;
            document.getElementById('count-spotify').textContent = allVideos.filter(v => v.platform === 'spotify').length;
            document.getElementById('count-apple').textContent = allVideos.filter(v => v.platform === 'apple').length;
        }

        // Set filter
        function setFilter(filter) {
            currentFilter = filter;
            
            // Update button styles
            ['all', 'youtube', 'spotify', 'apple'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = 'px-6 py-2 rounded-full font-medium transition bg-blue-600 text-white';
                    if (f === 'youtube') btn.className = 'px-6 py-2 rounded-full font-medium transition bg-red-600 text-white';
                    if (f === 'spotify') btn.className = 'px-6 py-2 rounded-full font-medium transition bg-green-600 text-white';
                    if (f === 'apple') btn.className = 'px-6 py-2 rounded-full font-medium transition bg-purple-600 text-white';
                } else {
                    btn.className = 'px-6 py-2 rounded-full font-medium transition bg-slate-700 text-slate-300 hover:bg-slate-600';
                }
            });
            
            renderVideos();
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        // Get platform color
        function getPlatformColor(platform) {
            const colors = {
                youtube: 'bg-red-500',
                spotify: 'bg-green-500',
                apple: 'bg-purple-500'
            };
            return colors[platform] || 'bg-gray-500';
        }

        // Get platform name
        function getPlatformName(platform) {
            const names = {
                youtube: 'YouTube',
                spotify: 'Spotify',
                apple: 'Apple Podcasts'
            };
            return names[platform] || platform;
        }

        // Render videos
        function renderVideos() {
            const grid = document.getElementById('videosGrid');
            const emptyState = document.getElementById('emptyState');
            
            const filteredVideos = currentFilter === 'all' 
                ? allVideos 
                : allVideos.filter(v => v.platform === currentFilter);
            
            if (filteredVideos.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            grid.classList.remove('hidden');
            
            grid.innerHTML = filteredVideos.map(video => `
                <div class="bg-slate-800/50 backdrop-blur-sm rounded-lg overflow-hidden border border-slate-700 hover:border-slate-600 transition group">
                    <!-- Thumbnail -->
                    <div class="relative aspect-video bg-slate-900 overflow-hidden">
                        ${video.thumbnail ? `
                            <img src="${video.thumbnail}" alt="${video.title}" 
                                class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        ` : `
                            <div class="w-full h-full flex items-center justify-center">
                                <svg class="w-16 h-16 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                        `}
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                            <svg class="w-16 h-16 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>
                        <div class="${getPlatformColor(video.platform)} absolute top-3 right-3 px-3 py-1 rounded-full text-xs font-medium">
                            ${getPlatformName(video.platform)}
                        </div>
                    </div>
                    
                    <!-- Content -->
                    <div class="p-4">
                        <h3 class="font-semibold text-lg mb-2 line-clamp-2 group-hover:text-blue-400 transition">
                            ${video.title}
                        </h3>
                        <p class="text-slate-400 text-sm mb-4 line-clamp-2">
                            ${video.description || 'No description available'}
                        </p>
                        
                        <div class="flex items-center gap-4 text-xs text-slate-500 mb-4">
                            <div class="flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                </svg>
                                ${formatDate(video.date)}
                            </div>
                            ${video.duration !== 'N/A' ? `
                                <div class="flex items-center gap-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    ${video.duration}
                                </div>
                            ` : ''}
                        </div>
                        
                        <a href="${video.url}" target="_blank" rel="noopener noreferrer"
                            class="flex items-center justify-center gap-2 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition font-medium">
                            Watch Now
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                            </svg>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', fetchAllVideos);
    </script>
</body>
</html>
